name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip

  typecheck:
    name: Typecheck (TS 7 + Effect diagnostics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: Build & npm smoke test (${{ matrix.os }})
    needs: [lint, typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Packs the launcher and this platform's binary, installs them with npm, runs via under Node.
      # Turbo builds the admin UI, which the binary embeds, first.
      - run: bun run smoke
      # Cross-compiles the binaries for every platform package.
      - run: bun run build
      # Chromium for the admin UI's browser tests, cached per Playwright version.
      - id: playwright
        run: echo "version=$(jq -r .devDependencies.playwright apps/e2e/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          # Where Playwright keeps browsers on Linux, and on macOS.
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # Installs the system libraries Chromium needs even when the browser comes from the cache.
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      # Runs the end-to-end suite, the browser tests included, against this platform's compiled binary.
      - run: bun run --filter @via/e2e test
        env:
          VIA_E2E_BIN: ${{ github.workspace }}/npm/via-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}/bin/via
      # A failed browser test leaves a Playwright trace: open it with `bunx playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.os }}
          path: apps/e2e/test-results/
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Both platforms the release publishes; arm64 is cross-compiled, not emulated.
      - name: Build for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: via:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
      - run: .github/scripts/docker-smoke.sh via:ci 0.0.0-ci
