name: Release

# Run from Actions → Release → Run workflow on main. Raises the latest vX.Y.Z tag
# by the chosen part and compiles the four binaries. Pushes ghcr.io/<owner>/via
# for linux/amd64 and linux/arm64 by digest, smoke-tests that image, and only
# then tags it X.Y.Z, X.Y, X (from 1.0.0 on) and latest. Then tags the commit
# and creates a GitHub release with generated notes, the binaries and their
# SHA256SUMS.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Reads the tags.
      contents: read
      # Reads CI's result for this commit.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != success ]; then
            echo "::error::CI for $GITHUB_SHA is '${conclusion:-not run}', not success. Wait for it, or fix main."
            exit 1
          fi

      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "${latest:-no release yet} -> v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun npm/set-version.ts "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      # Cross-compiles the binary, admin UI embedded, for every platform package.
      - run: bun run build
      - name: Name the binaries via-<os>-<arch> and sum them
        run: |
          mkdir dist
          for bin in npm/via-*/bin/via; do
            cp "$bin" "dist/$(basename "$(dirname "$(dirname "$bin")")")"
          done
          cd dist
          sha256sum via-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      # Tags the commit and creates the GitHub release.
      contents: write
      # Pushes the image, and its attestation, to ghcr.io.
      packages: write
      # Signs the build provenance attestations with a Sigstore certificate.
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/via
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ !startsWith(env.VERSION, '0.') }}
            type=raw,value=latest
      # Pushed by digest only: no tag points at the image until it passes the smoke test.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Smoke-test the pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: .github/scripts/docker-smoke.sh "$IMAGE@$DIGEST" "$VERSION"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      # A carbon copy (--prefer-index=false) of the tested index, so the tags
      # point at the very digest that was tested and attested.
      - name: Tag the tested image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}')
          if [ "$tagged" != "\"$DIGEST\"" ]; then
            echo "::error::$IMAGE:$VERSION is $tagged, not the tested $DIGEST."
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - name: Attest the binaries' provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/via-*
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            dist/via-darwin-arm64 dist/via-darwin-x64 dist/via-linux-arm64 dist/via-linux-x64 dist/SHA256SUMS
