# Workflow actions are pinned to commit SHAs and the Dockerfile's base images
# to digests, so nothing moves under us. Dependabot proposes the updates as
# reviewable PRs, bumping the SHA or digest together with its version comment.
#
# Commit subjects must read `type(scope): subject` (conventional-commits.yml):
# the prefix is the type and `include: scope` adds `(deps)`.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release gets a week in the wild before we take it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # A bump of oven/bun needs the same version in package.json's packageManager
  # and @types/bun; npm/bun-version.test.ts fails the PR until they match.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A release gets a week in the wild before we take it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # The JS dependencies, from package.json and bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # A release gets a week in the wild before we take it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Effect's packages release in lockstep and only work at the same version.
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        # The language service versions on its own.
        exclude-patterns:
          - "@effect/tsgo"
      # Everything else that isn't a major update, in one PR a week.
      minor-and-patch:
        update-types:
          - minor
          - patch
